name: _run-integration

on:
  workflow_call:
    secrets:
      STREAM_API_SECRET:
        # Lives in the ci environment, not at repo level, so it is not inheritable at
        # call time; the job resolves it by declaring that environment below.
        required: false

concurrency:
  # A constant, not `github.workflow`, which inside a reusable workflow resolves to the
  # caller's name and would let the daily run and the pre-tag gate hit the shared Stream
  # app at once. Not cancel-in-progress: a half-run leaves users and channels behind.
  group: run-integration-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  integration:
    name: 🧪 Integration tests
    environment: ci
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out code
        uses: actions/checkout@v5.0.1

      - name: Setup JDK 17
        uses: actions/setup-java@v5.1.0
        with:
          distribution: 'corretto'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Integration tests
        env:
          STREAM_BASE_URL: ${{ vars.STREAM_BASE_URL }}
          STREAM_API_KEY: ${{ vars.STREAM_API_KEY }}
          STREAM_API_SECRET: ${{ secrets.STREAM_API_SECRET }}
        run: ./gradlew integrationTest
