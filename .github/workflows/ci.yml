name: Build

on: [pull_request]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Skipped on a Release PR: it only bumps the version and rewrites the changelog. Not
  # keyed on github.actor, which is the pusher: clicking Update branch reattributes the
  # merge commit to whoever clicked, and the skip would stop firing on the normal release
  # path. The author and head repo clauses are what make it unforgeable; the branch name
  # on its own would let any PR call its branch release-please--x and skip the gate.
  # The skip also requires every changed file to be one release-please writes, so a code change pushed onto a Release PR by hand runs the unit lane. An unexpected file or a failed lookup fails toward running it.
  release-only:
    if: >-
      ${{ github.event.pull_request.user.login == 'github-actions[bot]'
      && github.event.pull_request.head.repo.full_name == github.repository
      && startsWith(github.head_ref, 'release-please--') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      skip: ${{ steps.files.outputs.skip }}
    steps:
      - id: files
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          ALLOWED: '^(CHANGELOG\.md|\.release-please-manifest\.json|gradle\.properties)$'
        run: |
          if ! files="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR}/files" --paginate --jq '.[].filename')"; then
            echo "::warning::Could not list this PR's files; running the unit lane."
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          other="$(printf '%s\n' "$files" | grep -Ev "$ALLOWED" || true)"
          if [ -n "$files" ] && [ -z "$other" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Files outside what release-please writes changed, so the unit lane runs: ${other//$'\n'/ }"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  unit:
    needs: release-only
    if: ${{ !cancelled() && needs.release-only.outputs.skip != 'true' }}
    uses: ./.github/workflows/run_tests.yml

  # The one required status check on main. A matrix job skipped by `if:` publishes a
  # single check run with the template unexpanded, so per-leg contexts could never be
  # satisfied on a Release PR; this job carries no matrix for that reason. `skipped` is
  # accepted only when release-only confirmed a release-please-only diff. `!cancelled()` rather than `always()`: a cancelled run must stay
  # red, not report a pass.
  tests-passed:
    name: 🧪 Tests
    needs: [release-only, unit]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check the unit lane
        env:
          RESULT: ${{ needs.unit.result }}
          SKIP: ${{ needs.release-only.outputs.skip }}
        run: |
          case "$RESULT" in
            success)
              echo "unit lane passed"
              ;;
            skipped)
              if [ "$SKIP" = "true" ]; then
                echo "release pr: unit lane skipped by design"
              else
                echo "::error::the unit lane was skipped without release-only confirming a release-please-only diff"
                exit 1
              fi
              ;;
            *)
              echo "::error::unit lane reported $RESULT"
              exit 1
              ;;
          esac
