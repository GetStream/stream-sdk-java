name: _run-tests

on:
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# The unit lane declares no environment and receives no credentials. Keep it that way: a
# fork PR gets no secrets and still goes green, and a live test added without the
# `integration` tag fails here instead of passing against someone else's Stream app.
jobs:
  test:
    name: 🧪 Test & lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out code
        uses: actions/checkout@v5.0.1

      - name: Setup JDK 17
        uses: actions/setup-java@v5.1.0
        with:
          distribution: 'corretto'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Test
        run: |
          ./gradlew spotlessCheck
          ./gradlew build --info
