name: _run-tests

on:
  workflow_call:
    secrets:
      STREAM_API_SECRET:
        # Lives in the ci environment, not at repo level, so it is not inheritable at
        # call time; the job resolves it by declaring that environment below.
        required: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Release PRs only bump the version and rewrite the changelog, and every commit in one
# already passed this suite on its own PR. The guard sits on each job, not on the caller,
# so a skipped job still reports success to a required status check.
jobs:
  ci:
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}
    # Keep this name: main requires the status check by name, and calling through a
    # reusable workflow already prefixes it with the caller job id.
    name: 🧪 Test & lint
    environment: ci
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out code
        uses: actions/checkout@v5.0.1

      - name: Setup JDK 17
        uses: actions/setup-java@v5.1.0
        with:
          distribution: 'corretto'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Test
        env:
          STREAM_BASE_URL: ${{ vars.STREAM_BASE_URL }}
          STREAM_API_KEY: ${{ vars.STREAM_API_KEY }}
          STREAM_API_SECRET: ${{ secrets.STREAM_API_SECRET }}
        run: |
          ./gradlew spotlessCheck
          ./gradlew build --info
