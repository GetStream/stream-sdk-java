name: _run-tests

on:
  workflow_call:
    secrets:
      STREAM_API_SECRET:
        # Lives in the ci environment, not at repo level, so it is not inheritable at
        # call time; the job resolves it by declaring that environment below.
        required: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Every job below skips on a Release PR. release-please only bumps the version and rewrites
# the changelog, and every source commit in one already passed this suite on the PR it came
# from. The guard sits on each job rather than on the calling job in ci.yml, because a job
# skipped by `if:` reports success and satisfies a required status check, while a reusable
# workflow that is never called produces no check at all. It tests the author as well as the
# branch name: on its own, the name would let any PR, a fork's included, call its branch
# release-please--x and skip every required check, which branch protection counts as met.
# The guard deliberately leaves out github.actor. That is the pusher, not the PR author,
# and clicking Update branch attributes the resulting merge commit to whoever clicked, so
# on a branch protection that requires the branch to be up to date the skip would never
# fire on a normal release. The cost is that a human commit pushed onto a Release PR is
# untested there; release.yml runs this suite on the merge commit before it tags.
jobs:
  ci:
    if: >-
      ${{ !(github.event.pull_request.user.login == 'github-actions[bot]'
      && github.event.pull_request.head.repo.full_name == github.repository
      && startsWith(github.head_ref, 'release-please--')) }}
    # Keep this name: main requires the status check by name, and calling through a
    # reusable workflow already prefixes it with the caller job id.
    name: 🧪 Test & lint
    environment: ci
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out code
        uses: actions/checkout@v5.0.1

      - name: Setup JDK 17
        uses: actions/setup-java@v5.1.0
        with:
          distribution: 'corretto'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Test
        env:
          STREAM_BASE_URL: ${{ vars.STREAM_BASE_URL }}
          STREAM_API_KEY: ${{ vars.STREAM_API_KEY }}
          STREAM_API_SECRET: ${{ secrets.STREAM_API_SECRET }}
        run: |
          ./gradlew spotlessCheck
          ./gradlew build --info
