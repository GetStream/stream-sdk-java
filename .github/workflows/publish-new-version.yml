name: Publish New Version

# Manual publish of the selected git ref to Maven Central.
# Same trigger as stream-chat-android: Actions → this workflow → Run workflow.
# Pick a branch in "Use workflow from", or pass `ref` to publish a different branch
# (needed for old lines like release-4.1.1-feed-counts that do not contain this file).
#
# Does not bump versions or merge to main. Publishes gradle.properties as-is.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch or tag to publish. Leave empty to use the branch selected in Use workflow from."
        required: false
        type: string
        default: ""
      prerelease:
        description: "Mark the GitHub release as a pre-release"
        required: false
        type: boolean
        default: true

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    name: 🚀 Publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          ref: ${{ inputs.ref != '' && inputs.ref || github.ref }}
          fetch-depth: 0

      - name: Resolve version
        run: |
          PROP=$(grep '^version=' gradle.properties | cut -d'=' -f2)
          if [ -z "$PROP" ]; then
            echo "❌ Could not read version from gradle.properties"
            exit 1
          fi
          echo "VERSION=$PROP" >> "$GITHUB_ENV"
          echo "PUBLISH_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "Publishing $PROP from $(git rev-parse --abbrev-ref HEAD) @ $(git rev-parse --short HEAD)"

      - name: Setup JDK 17
        uses: actions/setup-java@v5.1.0
        with:
          distribution: 'corretto'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Publish to MavenCentral
        run: |
          ./gradlew -Pversion="$VERSION" publishToSonatype --no-daemon --max-workers 1 closeAndReleaseSonatypeStagingRepository
        env:
          STREAM_API_KEY: ${{ vars.STREAM_API_KEY }}
          STREAM_API_SECRET: ${{ secrets.STREAM_API_SECRET }}
          GPG_KEY_CONTENTS: ${{ secrets.GPG_KEY_CONTENTS }}
          OSSRH_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          OSSRH_PASSWORD: ${{ secrets.OSSRH_PASSWORD }}
          SIGNING_KEY_ID: ${{ secrets.SIGNING_KEY_ID }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
          SIGNING_SECRET_KEY_RING_FILE: ${{ secrets.SIGNING_SECRET_KEY_RING_FILE }}
          SONATYPE_STAGING_PROFILE_ID: ${{ secrets.SONATYPE_STAGING_PROFILE_ID }}

      - name: Create GitHub release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ env.VERSION }}
          commit: ${{ env.PUBLISH_SHA }}
          name: ${{ env.VERSION }}
          prerelease: ${{ inputs.prerelease }}
          makeLatest: false
          token: ${{ secrets.GITHUB_TOKEN }}
